name: Test RaceTime

on:
  pull_request:
  push:
    branches:
      - z1rr-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast SQLite tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: project.settings.test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev

      - name: Run the substantive service-free suite
        run: python manage.py test --settings=project.settings.test -v 2

      - name: Verify generated files and Django checks
        run: |
          python manage.py collectstatic --noinput --settings=project.settings.test
          python manage.py makemigrations --check --dry-run --settings=project.settings.test
          python manage.py check --deploy --settings=project.settings.test

  service-integration-tests:
    name: MariaDB and Redis integration tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: racetime_ci
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RACETIME_CI_THROTTLE_HMAC_KEY: ci-only-dedicated-throttle-key-0123456789abcdef
      DJANGO_SETTINGS_MODULE: project.settings.ci
      RACETIME_CI_DB_NAME: racetime_ci
      RACETIME_CI_DB_USER: root
      RACETIME_CI_DB_PASSWORD: ci-root-password
      RACETIME_CI_DB_HOST: 127.0.0.1
      RACETIME_CI_DB_PORT: "3306"
      RACETIME_CI_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev

      - name: Prove MariaDB Redis and channel probes execute
        run: >-
          python manage.py test
          racetime.tests.settings.test_ci_settings.CISettingsContractTests
          --settings=project.settings.ci -v 2

      - name: Run the complete service-backed suite
        run: python manage.py test --settings=project.settings.ci -v 2

      - name: Verify generated files and Django checks
        run: |
          python manage.py collectstatic --noinput --settings=project.settings.ci
          python manage.py makemigrations --check --dry-run --settings=project.settings.ci
          python manage.py check --deploy --settings=project.settings.ci
