name: Validate RaceTime containers

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit integration and dependency gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out untrusted source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev

      - name: Verify pinned Gitleaks policy and repository history
        run: python scripts/security/verify_gitleaks.py --repository . --base-ref origin/master

      - name: Run repository contract and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run substantive Django tests
        run: python manage.py test --settings=project.settings.test -v 2

      - name: Check migrations and deployment configuration
        run: |
          python manage.py makemigrations --check --dry-run --settings=project.settings.test
          python manage.py check --deploy --settings=project.settings.test

  image:
    name: ${{ matrix.target }} ${{ matrix.platform }}
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [web, racebot]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out untrusted source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Select immutable local image name
        id: identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_sha="${HEAD_SHA:-$FALLBACK_SHA}"
          arch="${PLATFORM#linux/}"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "image=z1rr-racetime:${TARGET}-${arch}-test" >> "$GITHUB_OUTPUT"

      - name: Build one target and platform without push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: VCS_REF=${{ steps.identity.outputs.commit_sha }}
          tags: ${{ steps.identity.outputs.image }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}

      - name: Smoke the exact local image
        shell: pwsh
        run: >-
          tests/platform/smoke_images.ps1 -SkipBuild
          -ExpectedCommit '${{ steps.identity.outputs.commit_sha }}'
          -Platform '${{ matrix.platform }}' -Target '${{ matrix.target }}'

      - name: Fail on high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.identity.outputs.image }}
          format: table
          output: trivy-${{ matrix.target }}-${{ strategy.job-index }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.identity.outputs.image }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}-${{ strategy.job-index }}.spdx.json
          upload-artifact: false

      - name: Record local image digest
        shell: bash
        run: docker image inspect --format='{{.Id}}' '${{ steps.identity.outputs.image }}' > image.digest

      - name: Upload non-secret validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-image-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            trivy-*.txt
            sbom-*.spdx.json
            image.digest
          if-no-files-found: error
          retention-days: 14
