name: Publish immutable RaceTime images

# Deployment remains a separate explicit operator action.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed 40-character commit to release
        required: true
        type: string
      release_tag:
        description: Immutable version label beginning with v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  identity:
    name: Authorize and freeze release identity
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - name: Check out the exact tag or manual commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.ref }}

      - name: Verify and freeze identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
          SIGNING_PUBLIC_KEY_B64: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$PUSH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            test -n "$SIGNING_PUBLIC_KEY_B64"
            export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
            install -d -m 0700 "$GNUPGHOME"
            printf '%s' "$SIGNING_PUBLIC_KEY_B64" | base64 --decode | gpg --batch --import
            git verify-tag "$PUSH_TAG"
            EXPECTED_SHA="$(git rev-list -n 1 "$PUSH_TAG")"
            RELEASE_TAG="$PUSH_TAG"
          else
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            EXPECTED_SHA="$INPUT_SHA"
            RELEASE_TAG="$INPUT_TAG"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "commit_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  quality:
    name: Re-run release quality gates
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frozen commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install and test
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts
          npm audit --omit=dev
          python -m unittest discover -s tests -v
          python manage.py test --settings=project.settings.test -v 2
          python manage.py makemigrations --check --dry-run --settings=project.settings.test
          python manage.py check --deploy --settings=project.settings.test

  image:
    name: Publish ${{ matrix.target }} ${{ matrix.platform }}
    needs: [identity, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, racebot]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out frozen commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Define digest-addressed variant
        id: variant
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          COMMIT_SHA: ${{ needs.identity.outputs.commit_sha }}
        run: |
          set -euo pipefail
          arch="${PLATFORM#linux/}"
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}/racetime-${TARGET}"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=${image}:sha-${COMMIT_SHA}-${arch}" >> "$GITHUB_OUTPUT"
          echo "local=z1rr-racetime:${TARGET}-${arch}-test" >> "$GITHUB_OUTPUT"

      - name: Build and push one immutable variant
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: VCS_REF=${{ needs.identity.outputs.commit_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.identity.outputs.commit_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-only
          tags: ${{ steps.variant.outputs.tag }}
          push: true
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}-${{ matrix.platform }}

      - name: Pull and smoke the exact pushed digest
        shell: pwsh
        run: |
          docker pull --platform '${{ matrix.platform }}' '${{ steps.variant.outputs.image }}@${{ steps.build.outputs.digest }}'
          docker tag '${{ steps.variant.outputs.image }}@${{ steps.build.outputs.digest }}' '${{ steps.variant.outputs.local }}'
          tests/platform/smoke_images.ps1 -SkipBuild `
            -ExpectedCommit '${{ needs.identity.outputs.commit_sha }}' `
            -Platform '${{ matrix.platform }}' -Target '${{ matrix.target }}'

      - name: Fail on high or critical vulnerabilities in pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.variant.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          output: trivy-${{ matrix.target }}-${{ steps.variant.outputs.arch }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate per-platform SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.variant.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}-${{ steps.variant.outputs.arch }}.spdx.json
          upload-artifact: false

      - name: Attest build provenance for the exact variant
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.variant.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write per-platform release identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ steps.variant.outputs.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGEST" > "${TARGET}.linux-${ARCH}.digest"

      - name: Upload per-platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ steps.variant.outputs.arch }}
          path: |
            ${{ matrix.target }}.linux-${{ steps.variant.outputs.arch }}.digest
            trivy-${{ matrix.target }}-${{ steps.variant.outputs.arch }}.txt
            sbom-${{ matrix.target }}-${{ steps.variant.outputs.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Publish same-commit multi-platform manifests
    needs: [identity, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified variant identities and reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and verify digest-only manifests
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.identity.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          mkdir -p release-metadata
          for target in web racebot; do
            image="ghcr.io/${repository}/racetime-${target}"
            manifest="${image}:sha-${COMMIT_SHA}"
            AMD64_DIGEST="$(cat "artifacts/${target}.linux-amd64.digest")"
            ARM64_DIGEST="$(cat "artifacts/${target}.linux-arm64.digest")"
            [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools create --tag "$manifest" \
              "${image}@${AMD64_DIGEST}" "${image}@${ARM64_DIGEST}"
            docker buildx imagetools inspect "$manifest" --raw \
              > "release-metadata/${target}.manifest.json"
            grep -q '"architecture":"amd64"' "release-metadata/${target}.manifest.json"
            grep -q '"architecture":"arm64"' "release-metadata/${target}.manifest.json"
            manifest_hash="$(sha256sum "release-metadata/${target}.manifest.json" | cut -d' ' -f1)"
            printf 'sha256:%s\n' "$manifest_hash" > "release-metadata/${target}.manifest.digest"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          repository = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["COMMIT_SHA"]
          payload = {
              "schema_version": 1,
              "release_tag": os.environ["RELEASE_TAG"],
              "source_commit": commit,
              "source_url": f"https://github.com/{repository}/tree/{commit}",
              "license": "GPL-3.0-only",
              "license_url": f"https://github.com/{repository}/blob/{commit}/LICENSE",
              "images": {},
          }
          for target in ("web", "racebot"):
              payload["images"][target] = {
                  "tag": f"ghcr.io/{repository.lower()}/racetime-{target}:sha-{commit}",
                  "manifest_digest": Path(f"release-metadata/{target}.manifest.digest").read_text().strip(),
                  "linux_amd64_digest": Path(f"artifacts/{target}.linux-amd64.digest").read_text().strip(),
                  "linux_arm64_digest": Path(f"artifacts/{target}.linux-arm64.digest").read_text().strip(),
              }
          Path("release-metadata/release-identities.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload release identities manifests scans and SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: racetime-${{ needs.identity.outputs.release_tag }}-${{ needs.identity.outputs.commit_sha }}
          path: |
            release-metadata/
            artifacts/*.txt
            artifacts/*.spdx.json
          if-no-files-found: error
          retention-days: 90
