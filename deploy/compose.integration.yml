name: z1rr-racetime-integration

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - ./env/integration.env.example
  environment:
    DJANGO_SETTINGS_MODULE: project.settings.integration
  restart: "no"

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.integration:/etc/caddy/Caddyfile:ro
      - integration-caddy-data:/data
      - integration-caddy-config:/config
      - integration-static-data:/srv/racetime/static:ro
      - integration-media-data:/srv/racetime/media:ro
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    depends_on:
      web:
        condition: service_healthy
      fixture-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    command: ["web"]
    volumes:
      - integration-static-data:/srv/racetime/static
      - integration-media-data:/srv/racetime/media
      - ../tests/e2e:/fixtures:ro
    networks:
      proxy:
        ipv4_address: 172.30.0.3
      data: {}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fixture-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/srv/racetime/.docker/healthcheck", "web"]
      interval: 5s
      timeout: 3s
      retries: 24

  racebot:
    <<: *app
    profiles: ["racebot"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: racebot
    command: ["racebot"]
    networks:
      data: {}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mariadb:11.4.12@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file:
      - ./env/integration.env.example
    volumes:
      - integration-db-data:/var/lib/mysql
    networks:
      data: {}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    env_file:
      - ./env/integration.env.example
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - integration-redis-data:/data
    networks:
      data: {}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 24

  fixture-provider:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    env_file:
      - ./env/integration.env.example
    command: ["python", "/fixtures/fixture_discord.py"]
    volumes:
      - ../tests/e2e:/fixtures:ro
    networks:
      proxy:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  proxy:
    name: z1rr-racetime-integration-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/29
  data:
    name: z1rr-racetime-integration-data
    driver: bridge
    internal: true

volumes:
  integration-db-data:
    name: z1rr-racetime-integration-db
  integration-redis-data:
    name: z1rr-racetime-integration-redis
  integration-media-data:
    name: z1rr-racetime-integration-media
  integration-static-data:
    name: z1rr-racetime-integration-static
  integration-caddy-data:
    name: z1rr-racetime-integration-caddy-data
  integration-caddy-config:
    name: z1rr-racetime-integration-caddy-config
